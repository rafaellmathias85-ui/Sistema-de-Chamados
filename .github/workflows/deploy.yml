name: Deploy VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy on VPS
        run: |
          sudo mkdir -p /var/www/helpdesk/app
          sudo chown -R ubuntu:ubuntu /var/www/helpdesk
          cd /var/www/helpdesk/app

          if [ ! -d ".git" ]; then
            git clone https://github.com/rafaellmathias85-ui/Sistema-de-Chamados.git .
          fi

          git config --global --add safe.directory /var/www/helpdesk/app
          git fetch origin main
          git reset --hard origin/main

          if [ -f "deploy.sh" ]; then
            cp deploy.sh /var/www/helpdesk/deploy.sh
            chmod +x /var/www/helpdesk/deploy.sh
          fi

          if [ -f "/var/www/helpdesk/deploy.sh" ]; then
            bash /var/www/helpdesk/deploy.sh
          else
            echo "ERRO: deploy.sh nao encontrado!"
            exit 1
          fi
